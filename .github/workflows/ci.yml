name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # GUI 不要のテストに必要な最小依存（PyQt5/pyvista の重い GUI 系は除外）
          pip install numpy scipy scikit-image matplotlib pytest pytest-cov ruff
      - name: Lint (ruff)
        run: ruff check semisim tests
      - name: Run tests (engine only, headless)
        env:
          SEMISIM_HEADLESS: "1"
        run: pytest -q
